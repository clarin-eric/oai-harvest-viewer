services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: oai
      POSTGRES_USER: oai
      POSTGRES_PASSWORD: oai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker:/docker-entrypoint-initdb.d:ro
    networks:
      - oai_viewer
  postrest:
    image: postgrest/postgrest:v14.0
    container_name: postrest
    ports:
      - "3000:3000"
    environment:
      PGRST_DB_URI: postgres://oai:oai@postgres:5432/oai
      PGRST_DB_SCHEMAS: "api"
      PGRST_DB_ANON_ROLE: "view_api"
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:3000
    networks:
      - oai_viewer
  swagger:
    image: swaggerapi/swagger-ui
    container_name: swagger
    ports:
      - "8080:8080"
    expose:
      - "8080"
    environment:
      API_URL: http://localhost:3000/
  web:
    image: nginx
    container_name: web-nginx
    environment:
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:3000/
      OAI_OUTPUT_URI: http://localhost/oai-harvest-result/output
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./html/config.js:/etc/nginx/templates/config.js.template:ro
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "80:80"
    expose:
      - "80"
    networks:
      - oai_viewer
    
networks:
  oai_viewer:
    external: false

volumes:
  postgres_data:
